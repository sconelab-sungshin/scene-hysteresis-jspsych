<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <title>Scene Hysteresis Pilot</title>

  <!-- jsPsych --> //jsPsych불러오기
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>

  <link
    href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css"
    rel="stylesheet"
    type="text/css"
  >

  <style>

    body {
      background-color: #808080;
    }

    .jspsych-display-element {
      background-color: #808080;
    }

  </style>

</head>


<body></body>

<script>

// ============================================================
// 1. jsPsych 시작
// ============================================================

const jsPsych = initJsPsych({

  on_finish: function() {  //실험이 끝나면 데이터 저장

    const data = jsPsych.data.get()

  }

});



// ============================================================
// 2. 실험 설정
// ============================================================

const IMAGE_DURATION = 1200;
const FIXATION_DURATION = 400;
const ITI_DURATION = 800;
const REPETITIONS = 5;
const timeline = [];


// ============================================================
// 3. 자극 정의
// ============================================================

const stimulusPairs = [

  {
    attribute: 'recognition',
    pair: 'foliage_flower',
    folder:
      'stimuli/recognition/foliage_flower',
    A: 'foliage',
    B: 'flower'
  },

  {
    attribute: 'recognition',
    pair: 'new_old',
    folder:
      'stimuli/recognition/new_old',
    A: 'new',
    B: 'old'
  },

  {
    attribute: 'affordance',
    pair: 'soil_ice',
    folder:
      'stimuli/affordance/soil_ice',
    A: 'soil', //A,B 삭제
    B: 'ice'
  },

  {
    attribute: 'affordance',
    pair: 'dry_damp',
    folder:
      'stimuli/affordance/dry_damp',
    A: 'dry',
    B: 'damp'
  },

];



// ============================================================
// 4. 이미지 preload
// ============================================================

const imageFiles = [];


for (const pair of stimulusPairs) {

  for (let step = 1; step <= 9; step++) {

    const number =
      String(step).padStart(2, '0'); //1->01...

    imageFiles.push(
      `${pair.folder}/${number}.png`
    );

  }

}


const preload = {

  type: jsPsychPreload,
  images: imageFiles

};


timeline.push(preload);



// ============================================================
// 5. 제시 조건 생성
// ============================================================

let conditions = []; //빈 조건 목록 생성

for (const pair of stimulusPairs) {

  for (const direction of ['AtoB', 'BtoA', 'random']) {

    for (
      let repetition = 1;
      repetition <= REPETITIONS;
      repetition++
    ) {

      conditions.push({
        attribute: stimulusPairs, 
        pair: pair, 
        direction: direction,
        repetition: repetition

      });

    }

  }

}



// 60개 trial의 순서를 무작위화

conditions =
  jsPsych.randomization.shuffle(
    conditions
  );



// ============================================================
// 6. 한 개의 9단계 trial을 만드는 함수
// ============================================================

function makeSequence(condition, trialNumber) {


  let steps;


  // A → B
  if (condition.direction === 'AtoB') {

    steps = [
      1, 2, 3, 4, 5, 6, 7, 8, 9
    ];

  }


  // B → A
  else if (condition.direction === 'BtoA') {

    steps = [
      9, 8, 7, 6, 5, 4, 3, 2, 1
    ];

  }


  // Random
  else {

    steps =
      jsPsych.randomization.shuffle(
        [1, 2, 3, 4, 5, 6, 7, 8, 9]
      );

  }



  // ----------------------------------------------------------
  // 9개의 이미지 제시
  // ----------------------------------------------------------

  steps.forEach(function(step, position) {


    const number =
      String(step).padStart(2, '0');


    const imagePath =
      `${condition.pair.folder}/${number}.png`;



    // ========================================================
    // 이미지
    // ========================================================

    const imageTrial = {

      type:
        jsPsychImageKeyboardResponse,

      stimulus:
        imagePath,

      choices:
        ['e', 'i'],

      trial_duration:
        IMAGE_DURATION,

      response_ends_trial:
        false,

      prompt:

        `<p>
          E = ${condition.pair.A}
          &nbsp;&nbsp;&nbsp;&nbsp;
          I = ${condition.pair.B}
        </p>`,


      data: {

        task:
          'stimulus',

        trial_number:
          trialNumber,

        attribute_type:
          condition.pair.attribute,

        stimulus_pair:
          condition.pair.pair,

        direction:
          condition.direction,

        repetition:
          condition.repetition,

        sequence_position:
          position + 1,

        stimulus_step:
          step

      }

    };


    timeline.push(
      imageTrial
    );



    // ========================================================
    // fixation
    // ========================================================

    const fixation = {

      type:
        jsPsychHtmlKeyboardResponse,

      stimulus:
        '<div style="font-size:48px;">+</div>',

      choices:
        'NO_KEYS',

      trial_duration:
        FIXATION_DURATION,

      data: {
        task:
          'fixation'
      }

    };


    timeline.push(
      fixation
    );


  });

}



// ============================================================
// 7. 전체 30 trials 생성
// ============================================================

conditions.forEach(

  function(condition, index) {

    makeSequence(
      condition,
      index + 1
    );

  }

);



// ============================================================
// 8. 실험 실행
// ============================================================

jsPsych.run(
  timeline
);


</script>


</html>
