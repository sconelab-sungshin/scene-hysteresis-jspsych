<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image Trial Test</title>

  <script src="https://unpkg.com/jspsych@8.2.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>

  <link
    href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css"
    rel="stylesheet"
    type="text/css"
  >
</head>

<body></body>

<script>
  const jsPsych = initJsPsych();

  const trial = [];

  const frameCount = 30;
  const frameDuration = 200;
  const blankDuration = 300;

  //최초 응답이 발생했는지 저장하는 변수
  let responded = false;

  
//화면 하단에 응답 기록을 표시하는 함수, 새로운 div 요소 생성
  function showResponseFeedback() {
    const feedback = document.createElement('div');
//나중에 찾기 쉽도록 id 지정
    feedback.id = 'response-feedback';
    feedback.textContent = 'RESPONSE RECORDED';

    Object.assign(feedback.style, {
      position: 'fixed', //화면 스크롤해도 같은 위치 고정
      bottom: '10%',
      left: '50%',
      transform: 'translateX(-50%)',
      fontSize: '28px',
      fontWeight: 'bold',
      color: 'black',
      zIndex: '9999' //다른 요소보다 가장 위에 표시
    });
//실제 화면에 추가
    document.body.appendChild(feedback);

//3초 후 자동 제거
    setTimeout(() => {
      feedback.remove();
    }, 3000);
  }

  
//키보드 리스너
  function addFeedbackKeyListener() {
    const keyHandler = function(event) {
      if (
        event.code === 'Space' && //spacebar인지 확인
        event.repeat === false && 
        responded === false //아직 응답하지 않은 경우에만 처리
      ) {
        responded = true;
        showResponseFeedback();
      }
    };

    document.addEventListener('keydown', keyHandler);

    return keyHandler;
  }

  for (let i = 1; i <= frameCount; i++) {
    const fileNumber = String(i).padStart(2, '0');
    const imagePath = `stimuli/black_white_${fileNumber}.png`;

   

    let frameKeyHandler = null;

    const frame = {
      type: jsPsychImageKeyboardResponse,

      stimulus: imagePath,

      choices: function() {
        return responded ? 'NO_KEYS' : [' '];
      },

      response_ends_trial: false,
      trial_duration: frameDuration,
      stimulus_width: 800,

      data: {
        screen_type: 'image',
        frame_number: i,
        image_path: imagePath
      },

      on_load: function() {
        if (responded === false) {
          frameKeyHandler = addFeedbackKeyListener();
        }
      },

      on_finish: function(data) {
        if (frameKeyHandler !== null) {
          document.removeEventListener(
            'keydown',
            frameKeyHandler
          );
        }

        data.response_recorded = data.response !== null;
      }
    };

    

    let blankKeyHandler = null;

    const blank = {
      type: jsPsychHtmlKeyboardResponse,

      stimulus: `
        <p style="
          font-size: 48px;
          margin: 0;
        ">
          +
        </p>
      `,

      choices: function() {
        return responded ? 'NO_KEYS' : [' '];
      },

      response_ends_trial: false,
      trial_duration: blankDuration,

      data: {
        screen_type: 'blank',
        preceding_frame_number: i
      },

      on_load: function() {
        if (responded === false) {
          blankKeyHandler = addFeedbackKeyListener();
        }
      },

      on_finish: function(data) {
        if (blankKeyHandler !== null) {
          document.removeEventListener(
            'keydown',
            blankKeyHandler
          );
        }

        data.response_recorded = data.response !== null;
      }
    };

    trial.push(frame);
    trial.push(blank);
  }

  jsPsych.run(trial);
</script>
</html>
